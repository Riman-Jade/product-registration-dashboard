    if (search && !p.name.toLowerCase().includes(search)) return false;
    if (status !== 'all') {
      const hasStatus = COUNTRIES.some(c => p.statuses[c] === status);
      if (!hasStatus) return false;
    }
    if (country !== 'all') {
      const s = p.statuses[country] || '';
      if (!s || s === '미진행') return false;
    }
    return true;
  });
}

function renderTable() {
  const products = getFilteredProducts();
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');

  thead.innerHTML = `<tr>
    <th class="sticky">제품명</th>
    ${COUNTRIES.map(c => `<th title="${COUNTRY_NAMES[c] || c}">${c}</th>`).join('')}
    <th>Note</th>
  </tr>`;

  tbody.innerHTML = products.map(p => {
    const cells = COUNTRIES.map(c => {
      const s = p.statuses[c] || '';
      const cls = s ? `status-${s}` : '';
      let short = '';
      if (s === '완료') short = '\u2713';
      else if (s === '미진행') short = '-';
      else if (s === '심사중') short = '심';
      else if (s === '라벨제작') short = '라';
      else if (s === '서류취합') short = '서';
      else short = s ? s.charAt(0) : '';
      return `<td class="${cls}" title="${s}">${short}</td>`;
    }).join('');
    const noteCell = `<td class="note-col">${p.note || ''}</td>`;
    return `<tr><td class="sticky">${p.name}</td>${cells}${noteCell}</tr>`;
  }).join('');
}

// Populate country filter
const countrySelect = document.getElementById('filterCountry');
COUNTRIES.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c;
  opt.textContent = (COUNTRY_NAMES[c] || c) + ' (' + c + ')';
  countrySelect.appendChild(opt);
});

// Init
renderKPI();
renderLegend();
renderTable();

// Filter events
document.getElementById('filterBrand').addEventListener('change', renderTable);
document.getElementById('filterStatus').addEventListener('change', renderTable);
document.getElementById('filterCountry').addEventListener('change', renderTable);
document.getElementById('filterSearch').addEventListener('input', renderTable);
</script>
