function renderKPI() {

      <div class="value">${k.value}</div>
      <div class="label">${k.label}</div>
    </div>
  `).join('');

function renderLegend() {
  const container = document.getElementById('legend');
  container.innerHTML = Object.entries(STATUS_LABELS).map(([k, v]) => `
    <span class="legend-item">
      <span class="legend-dot" style="background:${STATUS_COLORS[k]}"></span>
      ${v}
    </span>
  `).join('');
}

function renderCountryBars() {
  const container = document.getElementById('countryBars');
  const sorted = COUNTRIES
    .map(c => ({ code: c, ...STATS.country_stats[c] }))
    .sort((a, b) => b.rate - a.rate)
    .slice(0, 15);
  container.innerHTML = sorted.map(c => `
    <div class="country-bar">
      <span class="name">${c.code}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${c.rate}%"></div></div>
      <span class="pct">${c.rate}%</span>
    </div>
  `).join('');
}

function renderStatusChart() {
  const ctx = document.getElementById('statusChart').getContext('2d');
  const statusCounts = {};
  const activeProducts = PRODUCTS.filter(p => !p.discontinued);
  activeProducts.forEach(p => {
    COUNTRIES.forEach(c => {
      const s = p.statuses[c] || '';
      if (s) statusCounts[s] = (statusCounts[s] || 0) + 1;
    });
  });
  const labels = Object.keys(statusCounts);
  const data = Object.values(statusCounts);
  const colors = labels.map(l => STATUS_COLORS[l] || '#94a3b8');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels.map(l => STATUS_LABELS[l] || l),
      datasets: [{ data, backgroundColor: colors, borderWidth: 0 }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 8 } }
      }
    }
  });
}

  const disc = document.getElementById('filterDiscontinued').value;
  const search = document.getElementById('filterSearch').value.toLowerCase();

  return PRODUCTS.filter(p => {
    if (brand !== 'all' && p.brand !== brand) return false;
    if (disc === 'active' && p.discontinued) return false;
    if (disc === 'disc' && !p.discontinued) return false;
    if (search && !p.name.toLowerCase().includes(search)) return false;
    if (status !== 'all') {
      const hasStatus = COUNTRIES.some(c => p.statuses[c] === status);
      if (!hasStatus) return false;
    }
    return true;
  });
}

function renderTable() {
  const products = getFilteredProducts();
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');

  thead.innerHTML = `<tr>
    <th class="sticky">제품명</th>
    ${COUNTRIES.map(c => `<th title="${COUNTRY_NAMES[c] || c}">${c}</th>`).join('')}
  </tr>`;

  tbody.innerHTML = products.map(p => {
    const rowClass = p.discontinued ? 'row-discontinued' : '';
    const cells = COUNTRIES.map(c => {
      const s = p.statuses[c] || '';
      const cls = s ? `status-${s}` : '';
      const short = s === '완료' ? '✓' : s === '불가' ? '✗' : s === '미출시' ? '-' : s === '미정' ? '?' : s === '불필요' ? '·' : s.charAt(0) || '';
      return `<td class="${cls}" title="${s}">${short}</td>`;
    }).join('');
    return `<tr class="${rowClass}"><td class="sticky" title="${p.name}">${p.name}</td>${cells}</tr>`;
  }).join('');
}

// Init
renderKPI();
renderLegend();
renderCountryBars();
renderStatusChart();
renderTable();

// Filter events
document.getElementById('filterBrand').addEventListener('change', renderTable);
document.getElementById('filterStatus').addEventListener('change', renderTable);
document.getElementById('filterDiscontinued').addEventListener('change', renderTable);
document.getElementById('filterSearch').addEventListener('input', renderTable);
</script>
</body>
</html>
